<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipmate Viewer</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            /* Prevent body scroll */
        }

        /* Custom scrollbar for table */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [clips, setClips] = useState([]);
            const [selectedClip, setSelectedClip] = useState(null);
            const [search, setSearch] = useState("");
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                fetchClips();
            }, [search]);

            const fetchClips = async () => {
                setLoading(true);
                try {
                    const res = await fetch(`/api/clips?search=${search}`);
                    const data = await res.json();
                    setClips(data);
                } catch (e) {
                    console.error(e);
                }
                setLoading(false);
            };

            const selectClip = async (id) => {
                try {
                    const res = await fetch(`/api/clips/${id}`);
                    const data = await res.json();
                    setSelectedClip(data);
                } catch (e) {
                    console.error(e);
                }
            };

            return (
                <div className="flex h-screen flex-col">
                    {/* Header / Toolbar */}
                    <header className="bg-gray-100 border-b p-2 flex items-center space-x-4">
                        <h1 className="text-sm font-bold text-gray-700">ClipMate Explorer</h1>
                        <input
                            type="text"
                            placeholder="Search..."
                            className="border rounded px-2 py-1 text-sm w-64"
                            value={search}
                            onChange={(e) => setSearch(e.target.value)}
                        />
                    </header>

                    {/* Top Pane: Clip List (Table) */}
                    <div className="flex-1 overflow-auto bg-white border-b h-1/2">
                        <table className="min-w-full text-left text-sm whitespace-nowrap">
                            <thead className="bg-gray-100 sticky top-0 z-10 shadow-sm">
                                <tr>
                                    <th className="px-2 py-1 font-semibold text-gray-600 border-r">Title</th>
                                    <th className="px-2 py-1 font-semibold text-gray-600 border-r w-32">Date/Time</th>
                                    <th className="px-2 py-1 font-semibold text-gray-600 border-r w-20">Size</th>
                                    <th className="px-2 py-1 font-semibold text-gray-600 border-r w-32">Source</th>
                                    <th className="px-2 py-1 font-semibold text-gray-600 border-r w-20">ID</th>
                                    <th className="px-2 py-1 font-semibold text-gray-600">Source URL</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {clips.map(clip => (
                                    <tr
                                        key={clip.id}
                                        className={`cursor-pointer hover:bg-blue-50 ${selectedClip && selectedClip.id === clip.id ? 'bg-blue-100' : ''}`}
                                        onClick={() => selectClip(clip.id)}
                                    >
                                        <td className="px-2 py-1 border-r max-w-md truncate" title={clip.title}>{clip.title || "Untitled"}</td>
                                        <td className="px-2 py-1 border-r">{clip.created_at}</td>
                                        <td className="px-2 py-1 border-r text-right">{clip.size}</td>
                                        <td className="px-2 py-1 border-r truncate max-w-[150px]" title={clip.creator}>{clip.creator}</td>
                                        <td className="px-2 py-1 border-r text-right">{clip.native_id}</td>
                                        <td className="px-2 py-1 truncate max-w-xs text-gray-500" title={clip.url}>{clip.url}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        {loading && <div className="p-4 text-center text-gray-500">Loading...</div>}
                    </div>

                    {/* Bottom Pane: Content Viewer */}
                    <div className="flex-1 bg-gray-50 overflow-hidden flex flex-col h-1/2">
                        <div className="bg-gray-200 px-2 py-1 text-xs font-bold text-gray-600 border-b">
                            Content Preview
                        </div>
                        <div className="flex-1 overflow-auto p-4">
                            {selectedClip ? (
                                <>
                                    {selectedClip.title && selectedClip.title.startsWith("Graphic:") ? (
                                        <div className="flex justify-center items-start h-full">
                                            <img
                                                src={`http://localhost:8000/api/clips/${selectedClip.id}/content`}
                                                alt="Clip Content"
                                                className="max-w-full max-h-full object-contain border shadow-sm bg-white"
                                            />
                                        </div>
                                    ) : (
                                        <pre className="whitespace-pre-wrap font-mono text-sm bg-white p-4 border shadow-sm min-h-full">
                                            {selectedClip.content_text || "No text content"}
                                        </pre>
                                    )}
                                </>
                            ) : (
                                <div className="flex items-center justify-center h-full text-gray-400">
                                    Select a clip to view content
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
