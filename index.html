<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipmate Viewer</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            /* Prevent body scroll */
        }

        /* Custom scrollbar for table */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [clips, setClips] = useState([]);
            const [selectedClip, setSelectedClip] = useState(null);
            const [search, setSearch] = useState("");
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                fetchClips();
            }, [search]);

            const fetchClips = async () => {
                setLoading(true);
                try {
                    const res = await fetch(`/api/clips?search=${search}`);
                    const data = await res.json();
                    setClips(data);
                } catch (e) {
                    console.error(e);
                }
                setLoading(false);
            };

            const selectClip = async (id) => {
                try {
                    const res = await fetch(`/api/clips/${id}`);
                    const data = await res.json();
                    setSelectedClip(data);
                } catch (e) {
                    console.error(e);
                }
            };

            const formatDate = (dateStr) => {
                if (!dateStr) return "—";
                const date = new Date(dateStr);
                return date.toLocaleString('en-US', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            };

            const formatSize = (bytes) => {
                if (!bytes || bytes === 0) return "—";
                if (bytes < 1024) return bytes + " B";
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
                return (bytes / (1024 * 1024)).toFixed(1) + " MB";
            };

            const renderContent = (clip) => {
                const formats = clip.format_list || "";

                // Check for images (PNG, JPEG, etc.)
                if (formats.includes("PNG") || formats.includes("JPG") || formats.includes("JPEG") || formats.includes("PICTURE")) {
                    return (
                        <div className="flex flex-col items-center justify-start h-full gap-4">
                            <img
                                src={`/api/clips/${clip.id}/content?content_type=image`}
                                alt="Clip Content"
                                className="max-w-full max-h-full object-contain border shadow-sm bg-white"
                            />
                            {clip.content_text && (
                                <div className="w-full bg-gray-100 p-3 border rounded text-sm">
                                    <div className="font-semibold text-gray-600 mb-1">Associated Text:</div>
                                    <pre className="whitespace-pre-wrap font-mono text-xs">{clip.content_text}</pre>
                                </div>
                            )}
                        </div>
                    );
                }

                // Check for HTML
                if (formats.includes("HTML")) {
                    return (
                        <div className="flex flex-col gap-4 h-full">
                            <div className="bg-white border shadow-sm p-4 rounded">
                                <div className="font-semibold text-gray-600 mb-2">HTML Preview:</div>
                                <iframe
                                    src={`/api/clips/${clip.id}/content?content_type=html`}
                                    className="w-full h-64 border"
                                    title="HTML Content"
                                />
                            </div>
                            {clip.content_text && (
                                <div className="bg-gray-100 p-3 border rounded">
                                    <div className="font-semibold text-gray-600 mb-1">Plain Text:</div>
                                    <pre className="whitespace-pre-wrap font-mono text-xs">{clip.content_text}</pre>
                                </div>
                            )}
                        </div>
                    );
                }

                // Default: Show text content
                return (
                    <div className="h-full">
                        <pre className="whitespace-pre-wrap font-mono text-sm bg-white p-4 border shadow-sm min-h-full">
                            {clip.content_text || "No text content available"}
                        </pre>
                    </div>
                );
            };

            return (
                <div className="flex h-screen flex-col">
                    {/* Header / Toolbar */}
                    <header className="bg-gray-100 border-b p-2 flex items-center space-x-4">
                        <h1 className="text-sm font-bold text-gray-700">ClipMate Explorer</h1>
                        <input
                            type="text"
                            placeholder="Search..."
                            className="border rounded px-2 py-1 text-sm w-64"
                            value={search}
                            onChange={(e) => setSearch(e.target.value)}
                        />
                    </header>

                    {/* Top Pane: Clip List (Table) */}
                    <div className="flex-1 overflow-auto bg-white border-b h-1/2">
                        <table className="min-w-full text-left text-sm whitespace-nowrap">
                            <thead className="bg-gray-100 sticky top-0 z-10 shadow-sm">
                                <tr>
                                    <th className="px-2 py-1 font-semibold text-gray-600 border-r">Title</th>
                                    <th className="px-2 py-1 font-semibold text-gray-600 border-r w-40">Created</th>
                                    <th className="px-2 py-1 font-semibold text-gray-600 border-r w-40">Modified</th>
                                    <th className="px-2 py-1 font-semibold text-gray-600 border-r w-32">Formats</th>
                                    <th className="px-2 py-1 font-semibold text-gray-600 border-r w-24">Size</th>
                                    <th className="px-2 py-1 font-semibold text-gray-600 border-r w-32">Creator</th>
                                    <th className="px-2 py-1 font-semibold text-gray-600 border-r w-24">Collection</th>
                                    <th className="px-2 py-1 font-semibold text-gray-600">Source URL</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {clips.map(clip => (
                                    <tr
                                        key={clip.id}
                                        className={`cursor-pointer hover:bg-blue-50 ${selectedClip && selectedClip.id === clip.id ? 'bg-blue-100' : ''}`}
                                        onClick={() => selectClip(clip.id)}
                                    >
                                        <td className="px-2 py-1 border-r max-w-md truncate" title={clip.title}>{clip.title || "Untitled"}</td>
                                        <td className="px-2 py-1 border-r text-xs">{formatDate(clip.created_at)}</td>
                                        <td className="px-2 py-1 border-r text-xs">{formatDate(clip.modified_at)}</td>
                                        <td className="px-2 py-1 border-r">
                                            <span className="text-xs bg-blue-100 px-1 py-0.5 rounded">{clip.format_list || "TEXT"}</span>
                                        </td>
                                        <td className="px-2 py-1 border-r text-right">{formatSize(clip.size)}</td>
                                        <td className="px-2 py-1 border-r truncate max-w-[150px]" title={clip.creator}>{clip.creator}</td>
                                        <td className="px-2 py-1 border-r text-xs truncate" title={clip.collection_name}>{clip.collection_name}</td>
                                        <td className="px-2 py-1 truncate max-w-xs text-gray-500 text-xs" title={clip.sourceurl}>{clip.sourceurl}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        {loading && <div className="p-4 text-center text-gray-500">Loading...</div>}
                    </div>

                    {/* Bottom Pane: Content Viewer */}
                    <div className="flex-1 bg-gray-50 overflow-hidden flex flex-col h-1/2">
                        <div className="bg-gray-200 px-2 py-1 text-xs font-bold text-gray-600 border-b flex justify-between items-center">
                            <span>Content Preview</span>
                            {selectedClip && (
                                <div className="flex gap-2 text-xs font-normal">
                                    <span className="bg-blue-200 px-2 py-0.5 rounded">{selectedClip.format_list}</span>
                                    <span className="text-gray-600">Size: {formatSize(selectedClip.size)}</span>
                                    <span className="text-gray-600">Collection: {selectedClip.collection_name}</span>
                                </div>
                            )}
                        </div>
                        <div className="flex-1 overflow-auto p-4">
                            {selectedClip ? (
                                <>
                                    {renderContent(selectedClip)}
                                </>
                            ) : (
                                <div className="flex items-center justify-center h-full text-gray-400">
                                    Select a clip to view content
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
